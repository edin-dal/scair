<!DOCTYPE html>
<html data-pathToRoot="" data-rawLocation="index" data-dynamicSideMenu="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ScaIR</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <link rel="stylesheet" href="styles/theme/bundle.css">
  <style>
    body {
      margin: 0;
      background-color: var(--mauve1);
      color: var(--mauve12);
      font-family: "Inter-Regular", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .landing {
      text-align: center;
      max-width: 640px;
      padding: 2rem;
    }
    .landing h1 {
      font-family: "Inter-Bold", sans-serif;
      font-size: 40px;
      margin-bottom: 0.5rem;
    }
    .landing p {
      font-family: "Inter-Regular", sans-serif;
      font-size: 18px;
      color: var(--mauve11);
      margin-bottom: 2.5rem;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .buttons a {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      background-color: var(--mauve12);
      color: var(--mauve1);
      text-decoration: none;
      font-family: "Inter-SemiBold", sans-serif;
      font-size: 16px;
    }
    .buttons a:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="landing">
    <h1>ScaIR</h1>
    <p>MLIR inspired Scala Compiler Framework</p>
    <div class="buttons">
      <a href="scair.html">API Reference</a>
      <a href="docs/index.html">Documentation</a>
    </div>
  </div>
</body>
</html>
