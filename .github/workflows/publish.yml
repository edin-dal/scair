name: Publishing

# Run on every push to main, or manually on any branch
on:
  push:
    branches: [ "main", "emilien/publish-single-deploy" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
    publish:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Publish
          env:
            MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET }}
            MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
            MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
            MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          # One sequential Maven deploy for all modules, instead of one parallel deploy per module.
          # __:UnidocModule selects the root module (scair-all), the only one extending it.
          run: >-
            ./mill mill.javalib.SonatypeCentralPublishModule/publishAll
            --publishArtifacts '{__:UnidocModule,__:ScairModule,__:ScairModule.nativeOpt}.publishArtifacts'